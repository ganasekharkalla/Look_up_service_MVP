# UI:        http://localhost:8080
# Swagger:  http://localhost:8080/swagger-ui.html
services:
  mongodb:
    image: mongo:7.0
    container_name: phonelookup-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build: .
    container_name: phonelookup-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/phone_lookup_db?maxPoolSize=100
      VERIPHONE_BASE_URL: ${VERIPHONE_BASE_URL:-http://127.0.0.1:8080}
      VERIPHONE_API_KEY: ${VERIPHONE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
