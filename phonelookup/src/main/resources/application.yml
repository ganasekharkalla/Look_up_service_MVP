server:
  port: 8080
  tomcat:
    threads:
      max: 300

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/phone_lookup_db?maxPoolSize=100
      auto-index-creation: true

twilio:
  base-url: ${TWILIO_BASE_URL:https://lookups.twilio.com}
  account-sid: ${TWILIO_ACCOUNT_SID:test_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:test_token}

lookup:
  freshness-days: 90
