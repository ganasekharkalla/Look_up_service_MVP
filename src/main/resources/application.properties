spring.application.name=lookup-service
spring.mongodb.uri=${MONGODB_URI:mongodb://mongo:12345678@localhost:27017/lookup_local?authSource=admin}
management.endpoints.web.exposure.include=health,info

lookup.staleness-ttl-days=30

provider.timeout-ms=5000
provider.retry.max-attempts=3
provider.retry.initial-backoff-ms=200
provider.retry.multiplier=2.0
provider.mock.failure-rate=0.0
provider.mock.permanent-failure-rate=0.0
provider.mock.latency-ms=50
